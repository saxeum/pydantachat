[project]
name = "pydantachat"
version = "0.1.0"
description = "A minimal Pydantic AI agent for DeepSeek, with vendor-neutral OpenTelemetry tracing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic-ai-slim[evals,openai]>=2.68.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pydantachat = "pydantachat.main:main"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
