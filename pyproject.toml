[project]
name = "pydantachat"
version = "0.1.0"
description = "A minimal configurable Pydantic AI agent with vendor-neutral OpenTelemetry tracing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.9.6",
    "fastapi>=0.163.0",
    "itsdangerous>=2.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic-ai-slim[evals,openai]>=2.68.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pydantachat = "pydantachat.main:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
markers = ["live: hits the real provider API (requires the default provider's API key)"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pydantachat"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
