<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pydantachat</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>pydantachat</h1>
      <div id="status">checking…</div>
    </header>

    <main>
      <ol id="log" aria-live="polite"></ol>

      <form id="composer" hidden>
        <textarea
          id="message"
          rows="2"
          placeholder="Ask whether a number is even… (⏎ to send, ⇧⏎ for a new line)"
          required
        ></textarea>
        <div class="actions">
          <button type="submit">send</button>
          <button type="button" id="new">new conversation</button>
        </div>
      </form>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
