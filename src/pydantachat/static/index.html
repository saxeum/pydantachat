<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>pydantachat</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/static/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/theme.css" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <div>
          <h1>pydantachat</h1>
          <p>Ask about your orders. Answers come from your own data.</p>
        </div>
        <nav id="status">checking…</nav>
      </header>

      <section id="log" aria-live="polite" hidden></section>

      <form id="composer" hidden>
        <label for="message">Your question</label>
        <textarea
          id="message"
          name="message"
          rows="2"
          placeholder="Try: what did I order in October?"
          required
        ></textarea>
        <div class="row">
          <button type="button" id="new" class="ghost">new conversation</button>
          <button type="submit">send</button>
        </div>
      </form>

      <article id="sign-in-card" hidden>
        <h2>Sign in</h2>
        <p>Use an allowlisted Google account to chat.</p>
        <a href="/login">Sign in with Google</a>
      </article>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
