<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>pydantachat</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/pico.min.css" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <hgroup>
          <h1>pydantachat</h1>
          <p>Ask whether a number is even. Every answer is a checked schema.</p>
        </hgroup>
        <nav id="status">checking…</nav>
      </header>

      <section id="log" aria-live="polite" hidden></section>

      <form id="composer" hidden>
        <label for="message">Your question</label>
        <textarea
          id="message"
          name="message"
          rows="2"
          placeholder="Try: is 42 even?"
          required
        ></textarea>
        <div class="grid">
          <button type="submit">send</button>
          <button type="button" id="new" class="secondary outline">
            new conversation
          </button>
        </div>
      </form>

      <article id="sign-in-card" hidden>
        <hgroup>
          <h2>Sign in</h2>
          <p>Use an allowlisted Google account to chat.</p>
        </hgroup>
        <a href="/login" role="button">Sign in with Google</a>
      </article>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
